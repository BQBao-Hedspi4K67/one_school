services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_education
    ports:
      - "5432:5432"
    volumes:
      - ai_education_postgres_data:/var/lib/postgresql/data

volumes:
  ai_education_postgres_data:
